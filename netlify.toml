[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Die gebauten Assets tragen einen Hash im Dateinamen und dürfen dauerhaft
# im Cache bleiben. Die HTML-Einstiegspunkte dürfen es nicht, sonst sehen
# wiederkehrende Spieler nach einem Deploy die alte Version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    # Das Spiel lädt nichts von fremden Hosts und baut keine Verbindungen auf
    # (die Bestenliste ist lokal). Die Richtlinie hält das fest, damit es so bleibt.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
